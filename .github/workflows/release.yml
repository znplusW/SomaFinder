name: Public Windows release candidate
on:
  push:
    branches: ['candidate/**']
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Full release or media-only diagnosis
        options: [full, media]
        default: full
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - name: Build self-contained portable package
        id: build
        shell: pwsh
        run: ./构建.ps1
      - name: Frontend core UI scheduling and backend-discovery regression
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/run-regression.ps1 -Scope full
      - name: Detached windows and waterfall resize
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: |
          ./ci/run-interaction.ps1 -Mode floating-windows
          ./ci/run-interaction.ps1 -Mode waterfall-resize
      - name: Content thumbnails and media preview
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: ./ci/run-waterfall.ps1
      - name: EXIF image orientation and preview interaction
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/run-interaction.ps1 -Mode image-preview
      - name: Public notices and synthetic showcase
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/run-interaction.ps1 -Mode public-release
      - name: Model memory policy settings and task coordination
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/run-model-memory.ps1
      - name: Real llama.cpp model unload and demand reload
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/run-model-memory-real.ps1
      - name: Native Soma backend identity and lifecycle integration
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/run-integration.ps1 -Scope backends
      - name: Search cancellation and pending backend requests
        if: always() && steps.build.outcome == 'success' && inputs.scope != 'media'
        shell: pwsh
        run: |
          $report=[IO.Path]::GetFullPath('reports/search-scenario.json')
          $process=Start-Process artifacts/portable/SomaFinder.exe -ArgumentList @('--verify-search-scenario',('--report='+$report)) -PassThru -WindowStyle Hidden
          if(-not $process.WaitForExit(120000)){$process.Kill($true);throw 'Search scenario timed out'}
          if($process.ExitCode -ne 0){throw 'Search scenario failed'}
      - name: Package validated release assets
        if: success() && inputs.scope != 'media'
        shell: pwsh
        run: ./ci/package-public.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && inputs.scope != 'media'
        with:
          name: SomaFinder-public-release-${{ github.run_id }}
          path: artifacts/release/
          retention-days: 14
