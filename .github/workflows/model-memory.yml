name: Model memory reclaim targeted checks
on:
  push:
    branches: ['test/model-memory-20261107']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - name: Build complete portable candidate
        id: build
        shell: pwsh
        run: ./构建.ps1
      - name: Memory policy settings lifecycle and HTTP integration
        id: memory
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: ./ci/run-model-memory.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-memory-core-${{ github.run_id }}
          path: reports/
          retention-days: 14
      - name: Directly affected frontend and scheduling regression
        if: success()
        shell: pwsh
        run: ./ci/run-regression.ps1 -Scope targeted
      - name: Real llama.cpp unload and demand reload
        if: success()
        shell: pwsh
        run: ./ci/run-model-memory-real.ps1
      - name: Backend identity and lifecycle integration after native inventory change
        if: success()
        shell: pwsh
        run: ./ci/run-integration.ps1 -Scope backends
      - name: Search cancellation and deferred backend work
        if: success()
        shell: pwsh
        run: |
          $report=[IO.Path]::GetFullPath('reports/search-scenario.json')
          $process=Start-Process artifacts/portable/SomaFinder.exe -ArgumentList @('--verify-search-scenario',('--report='+$report)) -PassThru -WindowStyle Hidden
          if(-not $process.WaitForExit(120000)){$process.Kill($true);throw 'Search scenario timed out'}
          if($process.ExitCode -ne 0){throw 'Search scenario failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-memory-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
